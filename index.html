<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDGs Plastic-Free Sustainability – Galaxy Cleanup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

  :root {
    --space-top:   #0b0c2a;
    --space-mid:   #1a1247;
    --space-low:   #2d1a5e;
    --planet-hi:   #6d4bc4;
    --planet-mid:  #4a2f8f;
    --planet-low:  #2a1a55;
    --nebula-pink: #ff5fae;
    --nebula-cyan: #38e1ff;
    --star:        #fdf6d8;
    --gold:        #ffd24a;
    --ink:         #0b0c2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(
      to bottom,
      #05061a 0%,
      var(--space-top) 12%,
      var(--space-mid) 30%,
      var(--space-low) 46%,
      #3a2470 49%,
      var(--planet-hi) 52%,
      var(--planet-mid) 74%,
      var(--planet-low) 100%
    );
    cursor: default;
  }

  /* ---- starfield ---- */
  .stars, .stars2 {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .stars  { animation: twinkle 4s ease-in-out infinite alternate; }
  .stars2 { animation: twinkle 6s ease-in-out infinite alternate-reverse; }
  @keyframes twinkle {
    from { opacity: 0.55; }
    to   { opacity: 1; }
  }
  .star {
    position: absolute;
    background: var(--star);
    border-radius: 50%;
    box-shadow: 0 0 6px 1px rgba(253,246,216,0.8);
  }

  /* nebula glow clouds */
  .nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(48px);
    z-index: 1;
    pointer-events: none;
  }
  .neb1 { width: 360px; height: 260px; top: 4%;  left: -6%;
          background: radial-gradient(circle, rgba(255,95,174,0.55), transparent 70%); }
  .neb2 { width: 420px; height: 300px; top: 14%; right: -8%;
          background: radial-gradient(circle, rgba(56,225,255,0.4), transparent 70%); }
  .neb3 { width: 300px; height: 220px; top: 30%; left: 38%;
          background: radial-gradient(circle, rgba(140,90,255,0.45), transparent 70%); }

  /* ---- the moon (big glowing body) ---- */
  .moon {
    position: absolute;
    top: 5%;
    right: 32%;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #fffef0, #ffe9a8 55%, #f0b94e);
    box-shadow: 0 0 60px 18px rgba(255,225,150,0.55);
    z-index: 2;
    animation: moonGlow 4.5s ease-in-out infinite alternate;
  }
  .moon::before, .moon::after {
    content: ""; position: absolute; border-radius: 50%;
    background: rgba(190,150,70,0.35);
  }
  .moon::before { width: 20px; height: 20px; top: 22px; left: 18px; }
  .moon::after  { width: 13px; height: 13px; top: 48px; left: 46px;
                  box-shadow: -16px -8px 0 -3px rgba(190,150,70,0.3); }
  @keyframes moonGlow {
    from { box-shadow: 0 0 48px 14px rgba(255,225,150,0.45); }
    to   { box-shadow: 0 0 78px 24px rgba(255,225,150,0.7); }
  }

  /* a ringed planet drifting in the distance */
  .planet-deco {
    position: absolute;
    top: 16%; left: 10%;
    z-index: 1;
    pointer-events: none;
    animation: floaty 9s ease-in-out infinite alternate;
  }
  @keyframes floaty {
    from { transform: translateY(0); }
    to   { transform: translateY(14px); }
  }

  /* shooting star sweeping across */
  .shooting {
    position: absolute;
    top: 8%; left: -10%;
    width: 110px; height: 2px;
    background: linear-gradient(90deg, transparent, #fff, var(--nebula-cyan));
    border-radius: 2px;
    z-index: 1;
    opacity: 0;
    animation: shoot 7s ease-in infinite;
  }
  @keyframes shoot {
    0%, 70%   { transform: translate(0,0) rotate(20deg); opacity: 0; }
    74%       { opacity: 1; }
    86%       { transform: translate(60vw, 26vh) rotate(20deg); opacity: 1; }
    92%, 100% { transform: translate(72vw, 32vh) rotate(20deg); opacity: 0; }
  }

  /* ---- moon surface terrain ---- */

  /* static moon surface terrain (the ground the debris sits on) */
  .surface {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    height: 51%;
    z-index: 2;
    pointer-events: none;
  }
  /* rolling rocky terrain silhouette along the top edge of the ground */
  .surface .ridge {
    position: absolute;
    top: -1px; left: 0;
    width: 100%;
    height: 60px;
  }
  /* dusty surface texture: speckles of moon dust, no motion */
  .surface .dust {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1.5px),
      radial-gradient(rgba(0,0,0,0.14) 1px, transparent 1.5px);
    background-size: 46px 46px, 70px 70px;
    background-position: 0 0, 23px 31px;
  }
  /* soft glow line where the surface meets space */
  .surface .rim {
    position: absolute;
    top: -3px; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg,
      transparent, rgba(160,200,255,0.55), rgba(200,160,255,0.55),
      rgba(160,200,255,0.55), transparent);
    filter: blur(2px);
  }

  /* surface craters */
  .crater {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 32%,
      rgba(255,255,255,0.10), rgba(0,0,0,0.18) 55%, rgba(0,0,0,0.42));
    box-shadow: inset 0 5px 10px rgba(0,0,0,0.5),
                inset 0 -3px 6px rgba(255,255,255,0.12),
                0 -2px 0 rgba(255,255,255,0.10);
    z-index: 2;
    pointer-events: none;
  }
  /* tiny moon rocks scattered on the ground */
  .rock {
    position: absolute;
    background: radial-gradient(circle at 38% 30%, #6e58a8, #3a2870 70%);
    box-shadow: 0 3px 5px rgba(0,0,0,0.45);
    z-index: 2;
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 26px;
    z-index: 20;
    pointer-events: none;
  }

  .title-block { max-width: 60%; }
  .game-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 38px);
    line-height: 1.05;
    color: #fff;
    text-shadow: 0 0 14px rgba(120,200,255,0.9), 0 3px 0 #2a1a55, 0 6px 16px rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
  }
  .game-title .accent {
    color: var(--nebula-cyan);
    text-shadow: 0 0 16px rgba(56,225,255,0.9), 0 3px 0 #16324a;
  }
  .subtitle {
    margin-top: 8px;
    font-size: clamp(11px, 1.2vw, 15px);
    font-weight: 700;
    color: #d8e6ff;
    background: rgba(45,26,94,0.7);
    border: 1px solid rgba(120,200,255,0.4);
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .panel {
    pointer-events: auto;
    background: rgba(20,16,52,0.88);
    border: 2px solid var(--nebula-cyan);
    border-radius: 18px;
    padding: 12px 18px;
    box-shadow: 0 0 22px rgba(56,225,255,0.4), 0 6px 0 rgba(8,6,28,0.6);
    text-align: right;
    min-width: 220px;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
  }
  .score-label {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--nebula-cyan);
  }
  .score-value {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 12px rgba(255,210,74,0.7);
  }
  .stat-line {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 700;
    color: #d8e6ff;
  }
  .progress {
    margin-top: 8px;
    height: 12px;
    width: 100%;
    background: #1c1740;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid rgba(120,200,255,0.5);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--nebula-cyan), var(--nebula-pink));
    box-shadow: 0 0 10px rgba(56,225,255,0.8);
    transition: width 0.35s ease;
  }
  .rating {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--nebula-pink);
    letter-spacing: 0.5px;
  }

  /* ---------- Spaceship ---------- */
  .ship {
    position: absolute;
    top: 24%;
    left: -180px;
    width: 150px;
    z-index: 4;
    filter: drop-shadow(0 0 12px rgba(56,225,255,0.6));
    animation: cruise 38s linear infinite;
  }
  .ship .bob { animation: shipBob 3s ease-in-out infinite alternate; transform-origin: 50% 50%; }
  @keyframes cruise {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 220px)); }
  }
  @keyframes shipBob {
    from { transform: translateY(-5px) rotate(-2deg); }
    to   { transform: translateY(6px) rotate(2deg); }
  }

  /* ---------- Debris (trash) ---------- */
  .trash {
    position: absolute;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.12s ease;
    filter: drop-shadow(0 0 6px rgba(120,200,255,0.55));
    animation: hover 3.5s ease-in-out infinite alternate;
  }
  @keyframes hover {
    from { margin-top: -3px; }
    to   { margin-top: 3px; }
  }
  .trash:hover { transform: scale(1.18) !important; z-index: 12;
                 filter: drop-shadow(0 0 12px rgba(56,225,255,0.95)); }
  .trash:active { transform: scale(0.92) !important; }
  .trash.collected {
    animation: warp 0.45s ease forwards;
    pointer-events: none;
  }
  @keyframes warp {
    0%   { transform: scale(1); opacity: 1; }
    45%  { transform: scale(1.6) rotate(30deg); opacity: 1;
           filter: drop-shadow(0 0 20px rgba(56,225,255,1)); }
    100% { transform: scale(0) rotate(90deg); opacity: 0; }
  }

  /* floating score popup */
  .pts-pop {
    position: absolute;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,210,74,0.9), 0 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    z-index: 15;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    25%  { transform: translateY(-12px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
  }

  /* ---------- Win overlay ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8,6,28,0.78);
    backdrop-filter: blur(4px);
    z-index: 50;
  }
  .overlay.show { display: flex; animation: fade 0.4s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .win-card {
    background: linear-gradient(160deg, #1c1450, #2d1a5e);
    border: 3px solid var(--gold);
    border-radius: 28px;
    padding: 40px 52px;
    text-align: center;
    box-shadow: 0 0 50px rgba(255,210,74,0.4), 0 18px 0 rgba(8,6,28,0.7);
    max-width: 460px;
    animation: drop 0.5s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes drop {
    from { transform: translateY(-60px) scale(0.8); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .win-card .tick { font-size: 58px; line-height: 1; }
  .win-card h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 38px;
    color: var(--nebula-cyan);
    text-shadow: 0 0 16px rgba(56,225,255,0.7);
    margin-bottom: 4px;
  }
  .win-card p {
    font-size: 17px;
    font-weight: 700;
    color: #d8e6ff;
    margin: 10px 0;
  }
  .win-card .final {
    font-family: 'Fredoka', sans-serif;
    font-size: 26px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255,210,74,0.6);
    margin: 14px 0;
  }
  .win-msg {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--nebula-pink);
    margin-bottom: 18px;
  }
  .btn {
    pointer-events: auto;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    background: var(--nebula-cyan);
    border: none;
    border-bottom: 5px solid #1c7a93;
    border-radius: 16px;
    padding: 12px 30px;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
  .btn.gold { background: var(--gold); border-bottom-color: #c9870f; color: var(--ink); }

  .reset-mini {
    position: absolute;
    bottom: 16px; left: 16px;
    z-index: 20;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: rgba(20,16,52,0.9);
    color: var(--nebula-cyan);
    border: 2px solid var(--nebula-cyan);
    border-radius: 12px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .reset-mini:hover { background: #241a55; }

  .hint {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-weight: 800;
    font-size: 14px;
    color: #d8e6ff;
    background: rgba(20,16,52,0.85);
    border: 1px solid rgba(120,200,255,0.4);
    padding: 6px 16px;
    border-radius: 20px;
  }
</style>
</head>
<body>
<div id="game">

  <div class="stars"  id="stars"></div>
  <div class="stars2" id="stars2"></div>
  <div class="nebula neb1"></div>
  <div class="nebula neb2"></div>
  <div class="nebula neb3"></div>
  <div class="shooting"></div>

  <div class="moon"></div>

  <!-- distant ringed planet -->
  <svg class="planet-deco" width="120" height="80" viewBox="0 0 120 80">
    <defs>
      <radialGradient id="pg" cx="38%" cy="34%">
        <stop offset="0%" stop-color="#ffd9f2"/>
        <stop offset="60%" stop-color="#c97fd6"/>
        <stop offset="100%" stop-color="#8a4fa0"/>
      </radialGradient>
    </defs>
    <ellipse cx="60" cy="40" rx="54" ry="14" fill="none" stroke="#7a5fd0" stroke-width="5" opacity="0.7"/>
    <circle cx="60" cy="40" r="24" fill="url(#pg)"/>
    <ellipse cx="60" cy="40" rx="54" ry="14" fill="none" stroke="#a98fe8" stroke-width="3" opacity="0.55"/>
  </svg>

  <!-- static moon surface terrain -->
  <div class="surface">
    <svg class="ridge" viewBox="0 0 1200 60" preserveAspectRatio="none">
      <path d="M0 30 L70 18 L150 34 L240 12 L330 28 L430 16 L530 32 L640 14 L740 30 L850 18 L960 34 L1070 20 L1200 30 L1200 60 L0 60 Z"
            fill="#5a3fa0"/>
      <path d="M0 38 L90 26 L190 40 L300 22 L410 38 L520 24 L640 40 L760 24 L880 40 L1000 26 L1120 40 L1200 30 L1200 60 L0 60 Z"
            fill="#4a2f8f"/>
    </svg>
    <div class="rim"></div>
    <div class="dust"></div>
  </div>

  <!-- surface craters -->
  <div class="crater" style="width:120px;height:44px;bottom:9%;left:5%;"></div>
  <div class="crater" style="width:80px;height:30px;bottom:20%;left:38%;"></div>
  <div class="crater" style="width:150px;height:52px;bottom:5%;right:7%;"></div>
  <div class="crater" style="width:64px;height:24px;bottom:28%;right:28%;"></div>
  <div class="crater" style="width:96px;height:36px;bottom:34%;left:15%;"></div>
  <div class="crater" style="width:70px;height:26px;bottom:14%;left:62%;"></div>

  <!-- scattered moon rocks -->
  <div class="rock" style="width:14px;height:11px;bottom:12%;left:24%;border-radius:46% 54% 60% 40%;"></div>
  <div class="rock" style="width:20px;height:15px;bottom:7%;left:52%;border-radius:55% 45% 40% 60%;"></div>
  <div class="rock" style="width:11px;height:9px;bottom:30%;left:48%;border-radius:50% 50% 45% 55%;"></div>
  <div class="rock" style="width:17px;height:13px;bottom:18%;right:18%;border-radius:42% 58% 55% 45%;"></div>
  <div class="rock" style="width:13px;height:10px;bottom:38%;right:40%;border-radius:60% 40% 50% 50%;"></div>
  <div class="rock" style="width:22px;height:16px;bottom:6%;left:10%;border-radius:48% 52% 58% 42%;"></div>


  <!-- spaceship cruising past -->
  <div class="ship">
    <svg viewBox="0 0 150 110" xmlns="http://www.w3.org/2000/svg">
      <g class="bob">
        <!-- engine flames -->
        <path d="M22 55 L4 50 L22 45 Z" fill="#ff7b3c"/>
        <path d="M22 55 L12 51 L22 49 Z" fill="#ffd24a"/>
        <!-- body -->
        <path d="M22 42 Q70 28 124 50 Q70 72 22 58 Z" fill="#cdd6e0" stroke="#8a93a8" stroke-width="2"/>
        <path d="M22 50 Q70 60 124 50 Q70 56 22 53 Z" fill="#9aa6bd"/>
        <!-- cockpit dome -->
        <path d="M82 36 Q104 30 112 46 Q98 50 84 47 Z" fill="#38e1ff" stroke="#1c7a93" stroke-width="2"/>
        <ellipse cx="94" cy="40" rx="7" ry="3.5" fill="#d6fbff" opacity="0.8"/>
        <!-- fin -->
        <path d="M40 42 L34 18 L54 40 Z" fill="#ff5fae" stroke="#b13b80" stroke-width="1.5"/>
        <!-- side stripe -->
        <path d="M40 52 L96 52" stroke="#ff5fae" stroke-width="3"/>
      </g>
    </svg>
  </div>

  <header>
    <div class="title-block">
      <div class="game-title">SDGs Plastic-Free Sustainability<br><span class="accent">Galaxy Cleanup</span></div>
      <div class="subtitle">🚀 Clear the orbiting space debris</div>
    </div>
    <div class="panel">
      <div class="score-row">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="stat-line">Collected: <span id="collected">0</span> / 50</div>
      <div class="progress"><div class="progress-fill" id="progress"></div></div>
      <div class="rating" id="rating">Performance: Pre-launch checks</div>
    </div>
  </header>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <div class="tick">🛸</div>
      <h2>Mission Complete!</h2>
      <p>The orbit is clear and debris-free.</p>
      <div class="final" id="finalScore">Final Score: 0</div>
      <div class="win-msg" id="winMsg">Great work, Star Guardian!</div>
      <button class="btn gold" id="nextBtn">Warp to the Next Level →</button>
    </div>
  </div>

  <button class="reset-mini" id="resetBtn">↻ Scatter New Debris</button>
  <div class="hint" id="hint">Bigger and rarer debris is worth more points!</div>
</div>

<script>
(function () {
  const game     = document.getElementById('game');
  const scoreEl  = document.getElementById('score');
  const collEl   = document.getElementById('collected');
  const progEl   = document.getElementById('progress');
  const ratingEl = document.getElementById('rating');
  const overlay  = document.getElementById('overlay');
  const finalEl  = document.getElementById('finalScore');
  const winMsgEl = document.getElementById('winMsg');
  const hint     = document.getElementById('hint');

  const TOTAL = 50;
  let score = 0;
  let collected = 0;

  const rand  = (a, b) => Math.random() * (b - a) + a;
  const randi = (a, b) => Math.floor(rand(a, b + 1));

  /* ---- build the starfield ---- */
  function buildStars(layer, count, maxSize) {
    let html = '';
    for (let i = 0; i < count; i++) {
      const s = rand(1, maxSize);
      html += '<div class="star" style="width:' + s + 'px;height:' + s +
              'px;top:' + rand(0, 48) + '%;left:' + rand(0, 100) + '%;"></div>';
    }
    layer.innerHTML = html;
  }
  buildStars(document.getElementById('stars'),  90, 2.6);
  buildStars(document.getElementById('stars2'), 60, 3.4);

  /* ---- Debris type definitions (real waste, floating in orbit) ---- */
  const TYPES = [
    {
      name: 'Plastic Bottle', points: 10, min: 34, max: 52,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <rect x="25" y="4" width="10" height="6" rx="2" fill="#3aa8c4"/>
        <rect x="23" y="9" width="14" height="5" fill="#bfe9f2"/>
        <path d="M22 14 Q22 22 26 26 L26 50 Q26 56 30 56 Q34 56 34 50 L34 26 Q38 22 38 14Z" fill="#9fdce8" stroke="#2a9bb8" stroke-width="1.5"/>
        <rect x="25" y="32" width="10" height="9" rx="1.5" fill="#eaf7f9" opacity="0.9"/>
        <line x1="28" y1="20" x2="28" y2="50" stroke="#fff" stroke-width="1.6" opacity="0.7"/>
      </svg>`
    },
    {
      name: 'Plastic Bag', points: 8, min: 36, max: 56,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <path d="M18 14 Q22 6 30 6 Q38 6 42 14" fill="none" stroke="#cfd8dc" stroke-width="3"/>
        <path d="M14 16 Q30 12 46 16 Q50 40 42 54 Q30 60 18 54 Q10 40 14 16Z" fill="#e8eef0" stroke="#aab7bd" stroke-width="1.5" opacity="0.92"/>

  function ratingText(p) {
    if (p === 0)   return 'Performance: Pre-launch checks';
    if (p < 0.25)  return 'Performance: Lift-off 🚀';
    if (p < 0.55)  return 'Performance: In orbit 🛰️';
    if (p < 0.85)  return 'Performance: Star cadet ⭐';
    if (p < 1)     return 'Performance: Almost clear ✨';
    return 'Performance: Star Guardian 🏆';
  }

  function updateHUD() {
    scoreEl.textContent = score;
    collEl.textContent  = collected;
    const p = collected / TOTAL;
    progEl.style.width  = (p * 100) + '%';
    ratingEl.textContent = ratingText(p);
  }

  function clearTrash() {
    game.querySelectorAll('.trash, .pts-pop').forEach(el => el.remove());
  }

  /* ---- spawn 50 debris items across the lower-half planet surface ---- */
  function spawnTrash() {
    clearTrash();
    score = 0;
    collected = 0;
    updateHUD();
    overlay.classList.remove('show');
    hint.style.display = '';

    const topMin = 54, topMax = 90;
    const leftMin = 3, leftMax = 92;

    for (let i = 0; i < TOTAL; i++) {
      const type = TYPES[randi(0, TYPES.length - 1)];
      const size = Math.round(rand(type.min, type.max));

      const sizeBonus = Math.round((size - type.min) / (type.max - type.min) * 6);
      const value = type.points + sizeBonus;

      const el = document.createElement('div');
      el.className = 'trash';
      el.innerHTML = type.svg(size);

      const rot = randi(0, 359);
      el.style.left = rand(leftMin, leftMax) + '%';
      el.style.top  = rand(topMin, topMax) + '%';
      el.style.transform = 'rotate(' + rot + 'deg)';
      el.style.animationDelay = (-rand(0, 3.5)) + 's';
      el.dataset.rot   = rot;
      el.dataset.value = value;
      el.title = type.name + ' · ' + value + ' pts';

      el.addEventListener('click', () => collect(el));
      game.appendChild(el);
    }
  }

  /* ---- collect one debris item ---- */
  function collect(el) {
    if (el.classList.contains('collected')) return;

    const value = parseInt(el.dataset.value, 10);
    score += value;
    collected++;
    updateHUD();

    const pop = document.createElement('div');
    pop.className = 'pts-pop';
    pop.textContent = '+' + value;
    pop.style.left = el.style.left;
    pop.style.top  = el.style.top;
    game.appendChild(pop);
    setTimeout(() => pop.remove(), 900);

    el.classList.add('collected');
    setTimeout(() => el.remove(), 450);

    if (collected === TOTAL) setTimeout(showWin, 500);
  }

  /* ---- win screen ---- */
  function showWin() {
    finalEl.textContent = 'Final Score: ' + score;
    let msg;
    if (score >= 480)      msg = 'Perfect cleanup — you are a true Star Guardian! 🌟';
    else if (score >= 380) msg = 'Excellent work keeping the galaxy debris-free!';
    else                   msg = 'Good job — the cosmos thanks you!';
    winMsgEl.textContent = msg;
    hint.style.display = 'none';
    overlay.classList.add('show');
  }

  document.getElementById('nextBtn').addEventListener('click', spawnTrash);
  document.getElementById('resetBtn').addEventListener('click', spawnTrash);

  spawnTrash();
})();
</script>
