<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDGs Plastic-Free Sustainability – Beach Cleanup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

  :root {
    --sand-light: #f4e4bc;
    --sand-mid:   #e6cf95;
    --sand-dark:  #d4b873;
    --sea-deep:   #1b6f8c;
    --sea-mid:    #2a9bb8;
    --sea-light:  #5bc7d6;
    --foam:       #eafaff;
    --ink:        #0f3a44;
    --gold:       #ffb627;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(
      to bottom,
      #aee7f5 0%,
      #cdeef0 14%,
      var(--sea-light) 15%,
      var(--sea-mid) 26%,
      var(--sea-deep) 38%,
      var(--sea-mid) 44%,
      #7fd0c9 47%,
      var(--sand-light) 50%,
      var(--sand-mid) 72%,
      var(--sand-dark) 100%
    );
    cursor: default;
  }

  /* sun */
  .sun {
    position: absolute;
    top: 5%;
    right: 32%;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fff6cf, #ffd24a 60%, #ffb627);
    box-shadow: 0 0 55px 16px rgba(255,210,74,0.55);
    z-index: 1;
    animation: sunGlow 4s ease-in-out infinite alternate;
  }
  @keyframes sunGlow {
    from { box-shadow: 0 0 45px 12px rgba(255,210,74,0.45); }
    to   { box-shadow: 0 0 70px 22px rgba(255,210,74,0.7); }
  }
  /* sun rays */
  .sun-rays {
    position: absolute;
    top: 5%;
    right: 32%;
    width: 80px; height: 80px;
    z-index: 1;
    transform-origin: 50% 50%;
    animation: spin 60s linear infinite;
  }
  .sun-rays::before {
    content: "";
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    background:
      conic-gradient(from 0deg,
        rgba(255,210,74,0.8) 0deg 7deg, transparent 7deg 30deg,
        rgba(255,210,74,0.8) 30deg 37deg, transparent 37deg 60deg,
        rgba(255,210,74,0.8) 60deg 67deg, transparent 67deg 90deg,
        rgba(255,210,74,0.8) 90deg 97deg, transparent 97deg 120deg,
        rgba(255,210,74,0.8) 120deg 127deg, transparent 127deg 150deg,
        rgba(255,210,74,0.8) 150deg 157deg, transparent 157deg 180deg,
        rgba(255,210,74,0.8) 180deg 187deg, transparent 187deg 210deg,
        rgba(255,210,74,0.8) 210deg 217deg, transparent 217deg 240deg,
        rgba(255,210,74,0.8) 240deg 247deg, transparent 247deg 270deg,
        rgba(255,210,74,0.8) 270deg 277deg, transparent 277deg 300deg,
        rgba(255,210,74,0.8) 300deg 307deg, transparent 307deg 330deg,
        rgba(255,210,74,0.8) 330deg 337deg, transparent 337deg 360deg);
    -webkit-mask: radial-gradient(circle, transparent 50%, #000 52%, #000 70%, transparent 72%);
            mask: radial-gradient(circle, transparent 50%, #000 52%, #000 70%, transparent 72%);
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* big boat sailing across the sea */
  .boat {
    position: absolute;
    top: 26%;
    left: -160px;
    width: 150px;
    z-index: 2;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.22));
    animation: sail 40s linear infinite;
  }
  .boat .hull-bob {
    animation: bob 3.2s ease-in-out infinite alternate;
    transform-origin: 50% 60%;
  }
  @keyframes sail {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(100vw + 200px)); }
  }
  @keyframes bob {
    from { transform: translateY(0) rotate(-2deg); }
    to   { transform: translateY(6px) rotate(2deg); }
  }

  /* clouds */
  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 50px;
    opacity: 0.92;
    z-index: 1;
    box-shadow: 18px 0 0 4px #fff, -16px 4px 0 -2px #fff;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud::before { width: 46px; height: 46px; top: -22px; left: 14px; }
  .cloud::after  { width: 32px; height: 32px; top: -14px; left: 52px; }
  .c1 { width: 96px; height: 30px; top: 6%;  left: 12%; animation: drift 46s linear infinite; }
  .c2 { width: 72px; height: 24px; top: 3%;  left: 44%; animation: drift 62s linear infinite; }
  /* big feature cloud that clearly floats left -> right */
  .c-big {
    width: 150px; height: 46px; top: 9%; left: 0;
    animation: driftBig 34s linear infinite;
  }
  .c-big::before { width: 72px; height: 72px; top: -34px; left: 24px; }
  .c-big::after  { width: 52px; height: 52px; top: -22px; left: 86px; }
  @keyframes drift {
    from { transform: translateX(-160px); }
    to   { transform: translateX(110vw); }
  }
  @keyframes driftBig {
    from { transform: translateX(-220px); }
    to   { transform: translateX(110vw); }
  }

  /* foam line where sea meets sand */
  .foam-line {
    position: absolute;
    left: 0; right: 0;
    top: 49.5%;
    height: 24px;
    background:
      radial-gradient(ellipse 80px 9px at 18% 50%, var(--foam) 60%, transparent 64%),
      radial-gradient(ellipse 95px 10px at 50% 50%, var(--foam) 60%, transparent 64%),
      radial-gradient(ellipse 85px 9px at 82% 50%, var(--foam) 60%, transparent 64%);
    opacity: 0.7;
    z-index: 2;
    animation: lap 5s ease-in-out infinite alternate;
  }
  @keyframes lap {
    from { transform: translateY(-2px); }
    to   { transform: translateY(3px); }
  }

  /* ---------- Ocean waves crashing onto the beach ---------- */
  .waves {
    position: absolute;
    left: 0; right: 0;
    top: 34%;
    height: 16%;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }
  .waves svg {
    position: absolute;
    left: 0;
    width: 220%;
    height: 100%;
  }
  /* three stacked wave layers moving sideways at different speeds */
  .wave-back  { animation: rollX 13s linear infinite; opacity: 0.55; }
  .wave-mid   { animation: rollX 9s  linear infinite; opacity: 0.75; }
  .wave-front { animation: rollX 6s  linear infinite; opacity: 0.95; }
  @keyframes rollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-45.4545%); } /* one tile of 220% width */
  }

  /* the surging foam wash that crashes onto the sand edge and recedes */
  .surf {
    position: absolute;
    left: 0; right: 0;
    top: 48%;
    height: 36px;
    z-index: 4;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70px 14px at 8% 55%,  rgba(255,255,255,0.9) 52%, transparent 58%),
      radial-gradient(ellipse 95px 16px at 26% 42%, rgba(255,255,255,0.9) 54%, transparent 60%),
      radial-gradient(ellipse 78px 14px at 45% 60%, rgba(255,255,255,0.9) 52%, transparent 58%),
      radial-gradient(ellipse 100px 17px at 64% 44%, rgba(255,255,255,0.9) 54%, transparent 60%),
      radial-gradient(ellipse 74px 14px at 82% 58%, rgba(255,255,255,0.9) 52%, transparent 58%),
      radial-gradient(ellipse 88px 15px at 97% 46%, rgba(255,255,255,0.9) 54%, transparent 60%);
    animation: crash 6s ease-in-out infinite;
  }
  @keyframes crash {
    0%   { transform: translateY(0px);  opacity: 0.35; }
    35%  { transform: translateY(4px);  opacity: 0.6; }
    55%  { transform: translateY(14px); opacity: 1; }    /* wave rushes a little up the sand */
    70%  { transform: translateY(10px); opacity: 0.9; }
    100% { transform: translateY(0px);  opacity: 0.35; } /* water recedes */
  }

  /* decorative beach details */
  .deco { position: absolute; z-index: 2; pointer-events: none; }

  /* ---------- Header ---------- */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 26px;
    z-index: 20;
    pointer-events: none;
  }

  .title-block { max-width: 60%; }
  .game-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3vw, 38px);
    line-height: 1.05;
    color: #fff;
    text-shadow: 0 3px 0 var(--sea-deep), 0 6px 12px rgba(0,0,0,0.25);
    letter-spacing: 0.5px;
  }
  .game-title .accent { color: var(--gold); }
  .subtitle {
    margin-top: 6px;
    font-size: clamp(11px, 1.2vw, 15px);
    font-weight: 700;
    color: var(--ink);
    background: rgba(255,255,255,0.7);
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .panel {
    pointer-events: auto;
    background: rgba(255,255,255,0.92);
    border: 3px solid var(--sea-deep);
    border-radius: 18px;
    padding: 12px 18px;
    box-shadow: 0 6px 0 rgba(15,58,68,0.35);
    text-align: right;
    min-width: 210px;
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
  }
  .score-label {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--sea-deep);
  }
  .score-value {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: var(--gold);
    line-height: 1;
  }
  .stat-line {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .progress {
    margin-top: 8px;
    height: 12px;
    width: 100%;
    background: #e3e9ea;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid var(--sea-deep);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--sea-light), var(--sea-mid));
    transition: width 0.35s ease;
  }
  .rating {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 800;
    color: var(--sea-mid);
    letter-spacing: 0.5px;
  }

  /* ---------- Trash ---------- */
  .trash {
    position: absolute;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.12s ease;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.28));
  }
  .trash:hover { transform: scale(1.18) !important; z-index: 12; }
  .trash:active { transform: scale(0.92) !important; }
  .trash.collected {
    animation: pop 0.4s ease forwards;
    pointer-events: none;
  }
  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    45%  { transform: scale(1.5) rotate(20deg); opacity: 1; }
    100% { transform: scale(0) rotate(60deg); opacity: 0; }
  }

  /* floating score popup */
  .pts-pop {
    position: absolute;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--gold);
    text-shadow: 0 2px 0 #fff, 0 0 8px rgba(0,0,0,0.3);
    pointer-events: none;
    z-index: 15;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) scale(0.6); opacity: 0; }
    25%  { transform: translateY(-12px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
  }

  /* ---------- Win overlay ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(13,52,62,0.55);
    backdrop-filter: blur(3px);
    z-index: 50;
  }
  .overlay.show { display: flex; animation: fade 0.4s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .win-card {
    background: linear-gradient(160deg, #ffffff, #eaf7f9);
    border: 5px solid var(--gold);
    border-radius: 28px;
    padding: 40px 52px;
    text-align: center;
    box-shadow: 0 18px 0 rgba(15,58,68,0.4);
    max-width: 460px;
    animation: drop 0.5s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes drop {
    from { transform: translateY(-60px) scale(0.8); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }
  .win-card h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 40px;
    color: var(--sea-deep);
    margin-bottom: 4px;
  }
  .win-card .tick {
    font-size: 58px;
    line-height: 1;
  }
  .win-card p {
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    margin: 10px 0;
  }
  .win-card .final {
    font-family: 'Fredoka', sans-serif;
    font-size: 26px;
    color: var(--gold);
    margin: 14px 0;
  }
  .win-msg {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--sea-mid);
    margin-bottom: 18px;
  }
  .btn {
    pointer-events: auto;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: #fff;
    background: var(--sea-mid);
    border: none;
    border-bottom: 5px solid var(--sea-deep);
    border-radius: 16px;
    padding: 12px 30px;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
  .btn.gold { background: var(--gold); border-bottom-color: #c9870f; color: var(--ink); }

  /* small reset button bottom-left */
  .reset-mini {
    position: absolute;
    bottom: 16px; left: 16px;
    z-index: 20;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: rgba(255,255,255,0.9);
    color: var(--sea-deep);
    border: 2px solid var(--sea-deep);
    border-radius: 12px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .reset-mini:hover { background: #fff; }

  .hint {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-weight: 800;
    font-size: 14px;
    color: var(--sea-deep);
    background: rgba(255,255,255,0.8);
    padding: 6px 16px;
    border-radius: 20px;
  }
</style>
</head>
<body>
<div id="game">

  <div class="sun-rays"></div>
  <div class="sun"></div>
  <div class="cloud c-big"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="foam-line"></div>

  <!-- big boat sailing across the sea -->
  <div class="boat">
    <svg viewBox="0 0 150 130" xmlns="http://www.w3.org/2000/svg">
      <g class="hull-bob">
        <!-- mast -->
        <rect x="71" y="14" width="5" height="62" rx="2" fill="#8a5a2b"/>
        <!-- main sail -->
        <path d="M76 16 Q116 38 104 72 L76 72 Z" fill="#fdfdfd" stroke="#d8dee0" stroke-width="1.5"/>
        <!-- front sail -->
        <path d="M70 20 Q40 44 50 72 L70 72 Z" fill="#ffd24a" stroke="#e0ad2c" stroke-width="1.5"/>
        <!-- flag -->
        <path d="M76 14 L92 19 L76 24 Z" fill="#ff6b6b"/>
        <!-- hull -->
        <path d="M30 76 L120 76 Q112 102 75 102 Q38 102 30 76 Z" fill="#d94f4f" stroke="#9e2f2f" stroke-width="2"/>
        <rect x="30" y="74" width="90" height="7" rx="3" fill="#f0f0f0"/>
        <!-- portholes -->
        <circle cx="58" cy="86" r="4" fill="#bfe9f2" stroke="#9e2f2f" stroke-width="1.5"/>
        <circle cx="75" cy="88" r="4" fill="#bfe9f2" stroke="#9e2f2f" stroke-width="1.5"/>
        <circle cx="92" cy="86" r="4" fill="#bfe9f2" stroke="#9e2f2f" stroke-width="1.5"/>
      </g>
    </svg>
  </div>

  <!-- ocean waves rolling toward shore -->
  <div class="waves">
    <svg class="wave-back" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0 120 C150 70 300 170 450 120 C600 70 750 170 900 120 C1050 70 1200 170 1350 120 C1500 70 1650 170 1800 120 L1800 200 L0 200 Z"
            fill="#2a9bb8"/>
    </svg>
    <svg class="wave-mid" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0 140 C150 95 300 185 450 140 C600 95 750 185 900 140 C1050 95 1200 185 1350 140 C1500 95 1650 185 1800 140 L1800 200 L0 200 Z"
            fill="#5bc7d6"/>
    </svg>
    <svg class="wave-front" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M0 160 C150 125 300 195 450 160 C600 125 750 195 900 160 C1050 125 1200 195 1350 160 C1500 125 1650 195 1800 160 L1800 200 L0 200 Z"
            fill="#eafaff"/>
    </svg>
  </div>

  <!-- foam crashing up onto the sand -->
  <div class="surf"></div>

  <!-- decorative beach elements -->
  <svg class="deco" style="bottom:6%;left:6%;width:90px;" viewBox="0 0 100 70">
    <path d="M50 70 C20 55 10 30 28 18 C40 10 50 22 50 30 C50 22 60 10 72 18 C90 30 80 55 50 70Z" fill="#ff8fa3" opacity="0.55"/>
  </svg>
  <svg class="deco" style="bottom:4%;right:9%;width:70px;" viewBox="0 0 100 100">
    <path d="M50 8 L58 40 L92 40 L64 60 L74 92 L50 72 L26 92 L36 60 L8 40 L42 40Z" fill="#ffd24a" opacity="0.5"/>
  </svg>
  <svg class="deco" style="bottom:14%;left:42%;width:54px;" viewBox="0 0 100 100">
    <ellipse cx="50" cy="58" rx="38" ry="30" fill="#f0a868" opacity="0.5"/>
    <ellipse cx="50" cy="50" rx="30" ry="24" fill="#e08a3c" opacity="0.45"/>
  </svg>

  <header>
    <div class="title-block">
      <div class="game-title">SDGs Plastic-Free Sustainability<br><span class="accent">Beach Cleanup</span></div>
      <div class="subtitle">🌊 Click the trash to clean the shore</div>
    </div>
    <div class="panel">
      <div class="score-row">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="stat-line">Collected: <span id="collected">0</span> / 50</div>
      <div class="progress"><div class="progress-fill" id="progress"></div></div>
      <div class="rating" id="rating">Performance: Just getting started</div>
    </div>
  </header>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <div class="tick">🏆</div>
      <h2>Mission Complete!</h2>
      <p>The beach is clean and plastic-free.</p>
      <div class="final" id="finalScore">Final Score: 0</div>
      <div class="win-msg" id="winMsg">Great work, Ocean Guardian!</div>
      <button class="btn gold" id="nextBtn">Go to the Next Level →</button>
    </div>
  </div>

  <button class="reset-mini" id="resetBtn">↻ Scatter New Trash</button>
  <div class="hint" id="hint">Bigger and rarer trash is worth more points!</div>
</div>

<script>
(function () {
  const game     = document.getElementById('game');
  const scoreEl  = document.getElementById('score');
  const collEl   = document.getElementById('collected');
  const progEl   = document.getElementById('progress');
  const ratingEl = document.getElementById('rating');
  const overlay  = document.getElementById('overlay');
  const finalEl  = document.getElementById('finalScore');
  const winMsgEl = document.getElementById('winMsg');
  const hint     = document.getElementById('hint');

  const TOTAL = 50;
  let score = 0;
  let collected = 0;

  /* ---- Trash type definitions: SVG icon factory, base points, size range ---- */
  // Each icon returns an <svg> string for a given pixel size.
  const TYPES = [
    {
      name: 'Plastic Bottle', points: 10, min: 34, max: 52,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <rect x="25" y="4" width="10" height="6" rx="2" fill="#3aa8c4"/>
        <rect x="23" y="9" width="14" height="5" fill="#bfe9f2"/>
        <path d="M22 14 Q22 22 26 26 L26 50 Q26 56 30 56 Q34 56 34 50 L34 26 Q38 22 38 14Z" fill="#9fdce8" stroke="#2a9bb8" stroke-width="1.5"/>
        <rect x="25" y="32" width="10" height="9" rx="1.5" fill="#eaf7f9" opacity="0.9"/>
        <line x1="28" y1="20" x2="28" y2="50" stroke="#fff" stroke-width="1.6" opacity="0.7"/>
      </svg>`
    },
    {
      name: 'Plastic Bag', points: 8, min: 36, max: 56,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <path d="M18 14 Q22 6 30 6 Q38 6 42 14" fill="none" stroke="#cfd8dc" stroke-width="3"/>
        <path d="M14 16 Q30 12 46 16 Q50 40 42 54 Q30 60 18 54 Q10 40 14 16Z" fill="#e8eef0" stroke="#aab7bd" stroke-width="1.5" opacity="0.92"/>
        <path d="M22 20 Q30 24 38 20" fill="none" stroke="#c2ccd0" stroke-width="2"/>
        <path d="M20 34 Q30 30 40 36" fill="none" stroke="#c2ccd0" stroke-width="1.5"/>
      </svg>`
    },
    {
      name: 'Paper Container', points: 6, min: 32, max: 48,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <path d="M16 22 L44 22 L40 50 L20 50Z" fill="#e6c79a" stroke="#b8965f" stroke-width="1.5"/>
        <rect x="14" y="16" width="32" height="8" rx="2" fill="#f0dcb8" stroke="#b8965f" stroke-width="1.5"/>
        <path d="M22 30 L38 30 M23 38 L37 38" stroke="#c9a877" stroke-width="2"/>
      </svg>`
    },
    {
      name: 'Styrofoam', points: 5, min: 30, max: 46,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <path d="M14 24 L46 24 L42 48 Q30 54 18 48Z" fill="#fbfdfd" stroke="#cdd6d8" stroke-width="1.5"/>
        <ellipse cx="30" cy="24" rx="16" ry="6" fill="#ffffff" stroke="#cdd6d8" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="1.6" fill="#dfe6e8"/>
        <circle cx="33" cy="38" r="1.6" fill="#dfe6e8"/>
        <circle cx="28" cy="42" r="1.4" fill="#dfe6e8"/>
      </svg>`
    },
    {
      name: 'Drink Cup', points: 9, min: 34, max: 50,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <ellipse cx="30" cy="16" rx="15" ry="5" fill="#bfe9f2" stroke="#2a9bb8" stroke-width="1.5"/>
        <path d="M15 16 L20 50 Q30 55 40 50 L45 16Z" fill="#dff3f7" stroke="#2a9bb8" stroke-width="1.5"/>
        <rect x="29" y="2" width="3" height="16" fill="#ff8fa3"/>
        <ellipse cx="30" cy="16" rx="9" ry="3" fill="#fff" opacity="0.7"/>
        <path d="M22 28 L38 28" stroke="#9fd6e2" stroke-width="2"/>
      </svg>`
    },
    {
      name: 'Soda Can', points: 12, min: 30, max: 44,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <rect x="20" y="10" width="20" height="40" rx="4" fill="#d94f4f" stroke="#9e2f2f" stroke-width="1.5"/>
        <ellipse cx="30" cy="10" rx="10" ry="3.5" fill="#e8e8e8" stroke="#9e2f2f" stroke-width="1.2"/>
        <ellipse cx="30" cy="50" rx="10" ry="3.5" fill="#b03c3c"/>
        <rect x="20" y="24" width="20" height="10" fill="#f0f0f0" opacity="0.85"/>
        <line x1="24" y1="14" x2="24" y2="46" stroke="#fff" stroke-width="1.4" opacity="0.6"/>
      </svg>`
    },
    {
      name: 'Bottle Cap', points: 3, min: 18, max: 26,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="20" fill="#ffb627" stroke="#c9870f" stroke-width="2"/>
        <circle cx="30" cy="30" r="13" fill="#ffd27a"/>
        <g stroke="#c9870f" stroke-width="2">
          <line x1="30" y1="10" x2="30" y2="18"/><line x1="30" y1="42" x2="30" y2="50"/>
          <line x1="10" y1="30" x2="18" y2="30"/><line x1="42" y1="30" x2="50" y2="30"/>
          <line x1="16" y1="16" x2="22" y2="22"/><line x1="38" y1="38" x2="44" y2="44"/>
          <line x1="44" y1="16" x2="38" y2="22"/><line x1="22" y1="38" x2="16" y2="44"/>
        </g>
      </svg>`
    },
    {
      name: 'Drink Straw', points: 4, min: 26, max: 42,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <path d="M18 50 L30 22 L30 10" fill="none" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round"/>
        <path d="M30 10 L34 8" fill="none" stroke="#ff6b9d" stroke-width="6" stroke-linecap="round"/>
        <path d="M18 50 L30 22 L30 10" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
      </svg>`
    },
    {
      name: 'Glass Bottle', points: 14, min: 36, max: 54,
      svg: s => `<svg width="${s}" height="${s}" viewBox="0 0 60 60">
        <rect x="27" y="4" width="6" height="8" fill="#3f7d4f"/>
        <path d="M26 12 Q26 20 22 26 L22 52 Q22 56 30 56 Q38 56 38 52 L38 26 Q34 20 34 12Z" fill="#6fae7d" stroke="#3f7d4f" stroke-width="1.5" opacity="0.92"/>
        <rect x="24" y="34" width="12" height="12" rx="1.5" fill="#cfe6d4" opacity="0.85"/>
        <line x1="26" y1="22" x2="26" y2="50" stroke="#eafaf0" stroke-width="2" opacity="0.7"/>
      </svg>`
    }
  ];

  /* ---- helpers ---- */
  const rand  = (a, b) => Math.random() * (b - a) + a;
  const randi = (a, b) => Math.floor(rand(a, b + 1));

  function ratingText(p) {
    if (p === 0)   return 'Performance: Just getting started';
    if (p < 0.25)  return 'Performance: Warming up 🌱';
    if (p < 0.55)  return 'Performance: Making waves 🌊';
    if (p < 0.85)  return 'Performance: Beach hero 🐚';
    if (p < 1)     return 'Performance: Almost spotless ✨';
    return 'Performance: Ocean Guardian 🏆';
  }

  function updateHUD() {
    scoreEl.textContent = score;
    collEl.textContent  = collected;
    const p = collected / TOTAL;
    progEl.style.width  = (p * 100) + '%';
    ratingEl.textContent = ratingText(p);
  }

  function clearTrash() {
    game.querySelectorAll('.trash, .pts-pop').forEach(el => el.remove());
  }

  /* ---- spawn 50 trash items in the lower half (the beach) ---- */
  function spawnTrash() {
    clearTrash();
    score = 0;
    collected = 0;
    updateHUD();
    overlay.classList.remove('show');
    hint.style.display = '';

    // Lower-half band: keep clear of header & sea, and a little margin.
    // Sand visually starts at ~50% height; place trash between 52% and 92%.
    const topMin = 54, topMax = 90;
    const leftMin = 3, leftMax = 92;

    for (let i = 0; i < TOTAL; i++) {
      const type = TYPES[randi(0, TYPES.length - 1)];
      const size = Math.round(rand(type.min, type.max));

      // size influences score: bigger pieces of the same type score a bit more
      const sizeBonus = Math.round((size - type.min) / (type.max - type.min) * 6);
      const value = type.points + sizeBonus;

      const el = document.createElement('div');
      el.className = 'trash';
      el.innerHTML = type.svg(size);

      const rot = randi(0, 359);
      el.style.left = rand(leftMin, leftMax) + '%';
      el.style.top  = rand(topMin, topMax) + '%';
      el.style.transform = 'rotate(' + rot + 'deg)';
      el.dataset.rot   = rot;
      el.dataset.value = value;
      el.title = type.name + ' · ' + value + ' pts';

      el.addEventListener('click', () => collect(el));
      game.appendChild(el);
    }
  }

  /* ---- collect one trash item ---- */
  function collect(el) {
    if (el.classList.contains('collected')) return;

    const value = parseInt(el.dataset.value, 10);
    score += value;
    collected++;
    updateHUD();

    // floating points popup
    const pop = document.createElement('div');
    pop.className = 'pts-pop';
    pop.textContent = '+' + value;
    pop.style.left = el.style.left;
    pop.style.top  = el.style.top;
    game.appendChild(pop);
    setTimeout(() => pop.remove(), 900);

    el.classList.add('collected');
    setTimeout(() => el.remove(), 400);

    if (collected === TOTAL) setTimeout(showWin, 500);
  }

  /* ---- win screen ---- */
  function showWin() {
    finalEl.textContent = 'Final Score: ' + score;
    let msg;
    if (score >= 480)      msg = 'Perfect cleanup — you are a true Ocean Guardian! 🌟';
    else if (score >= 380) msg = 'Excellent work keeping the ocean plastic-free!';
    else                   msg = 'Good job — the sea life thanks you!';
    winMsgEl.textContent = msg;
    hint.style.display = 'none';
    overlay.classList.add('show');
  }

  document.getElementById('nextBtn').addEventListener('click', spawnTrash);
  document.getElementById('resetBtn').addEventListener('click', spawnTrash);

  // scatter fresh trash every time the page loads
  spawnTrash();
})();
</script>
